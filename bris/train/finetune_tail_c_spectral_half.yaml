# tail-mm: none   (read by finetune.sbatch: Pavo has no threshold, so the units check runs on finetune)
# PAVO + SPECTRAL AT HALF ITS TAIL DOSE: A LESS WET PAVO.
#
#   scripts/diff_configs.py finetune_tail_c_spectral finetune_tail_c_spectral_half
#   sbatch bris/slurm/finetune.sbatch finetune_tail_c_spectral_half
#
# Pavo + spectral ranks wet days best but forecasts heavy rain too often, and
# MET's measure is the raw forecast, not the calibrated one. Across its three
# draws its raw Brier at 20 mm followed its wetness: frequency bias 1.14,
# 1.06 and 0.90 gave +2.3, -1.6 and -3.8 % against the control arm with the
# spectral term. This is the same recipe with half the tail weight, to make
# it less wet without losing the ranking. See evaluation/half_dose_plan.json.
#
# Half of 39.09. Pavo's term was 1/11 of an extreme state's loss; at this
# weight it is about 1/21. Same term, so no new measurement: the ratio of the
# two terms scales with the weight. Seed 20260909, as finetune_tail_c_spectral.

defaults:
- finetune_tail_c_spectral
- _self_

training:
  training_loss:
    loss_weights: [1.0, 0.1, 19.545]
