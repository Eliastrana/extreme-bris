# TREATMENT ARM. The control arm plus one extra loss term, and nothing else.
#
#   scripts/tail_threshold.py                 # get the number below
#   sbatch bris/slurm/finetune.sbatch finetune_tail
#
# This file inherits finetune.yaml and overrides exactly one key. Every date,
# every dataset, the learning rate, the step count, the ensemble size and the
# seed come from there, so a difference in the results has one candidate
# cause. Check that claim rather than trusting it:
#
#   scripts/diff_configs.py finetune finetune_tail
#
# should print training.training_loss and nothing more.
#
# WHAT THE THIRD TERM DOES. It is the same almost-fair kernel CRPS as the
# first, scored on max(x, threshold) of precipitation and on zero everywhere
# else. Clipping at a threshold is what turns CRPS into threshold-weighted
# CRPS for the indicator weight, which keeps the score proper; the reasoning
# and the reference are in xbris/losses.py. Zeroing the other variables stops
# this term from quietly reweighting all 98 of them instead of the tail.
#
# WHY THE FIRST TWO TERMS STAY. A loss that is blind below the threshold would
# trade away ordinary days without noticing, and ordinary days are 341 of the
# year. The tail term is added at a weight, not swapped in.
#
# WHAT IS DELIBERATELY NOT HERE: OVERSAMPLING. The other knob changes which
# states the model sees rather than what the loss cares about. Turning both at
# once gives a result with two candidate causes and no way to separate them,
# so it is a third arm and a later run, not an addition to this one.

defaults:
- finetune
- _self_

training:
  # A NORDIC-ONLY AREA WEIGHT, USED BY THE TAIL TERM AND NOTHING ELSE.
  #
  # The ranking that decides what counts as extreme looked only at the MEPS
  # half of the grid. The tail term looked at the whole stretched grid, and
  # somewhere in the tropics it rains more than 20 mm in six hours every day.
  # Counted from the data on eleven measured states: over 20 mm, extreme states
  # had 5,400 Nordic points each and ordinary states 730, a sevenfold
  # difference, while the global half had about 1,350 on both. On ordinary
  # days 65 percent of the exceedances were global. A term that fires every
  # day cannot keep the quiet days out of the loss.
  #
  # lam_area_weight is the graph's own area weight with every global node set
  # to zero: nodes 0 to 822,680 are the Nordic cutout. Normalised to unit sum
  # like the global node_weights, so the term is an area-weighted average over
  # the Nordic region only. The main term keeps the global weights; it is still
  # Bris's own objective, unchanged between the arms.
  scalers:
    lam_node_weights:
      _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
      nodes_name: ${graph.data}
      nodes_attribute_name: lam_area_weight
      norm: unit-sum

  training_loss:
    _target_: anemoi.training.losses.combined.CombinedLoss
    losses:
        # --- identical to the control arm ---------------------------------
        # If this drifts from finetune.yaml, the experiment is measuring the
        # drift. diff_configs.py is what catches that.
        #
        # There was a spectral term here too, matching Bris's pretraining. It
        # is gone from both arms because the class does not exist in this
        # anemoi; the reasoning is in finetune.yaml.
        - _target_: anemoi.training.losses.AlmostFairKernelCRPS
          alpha: 0.95
          scalers: ['pressure_level', 'general_variable', 'nan_mask_weights', 'node_weights']

        # --- the only thing this arm adds ---------------------------------
        - _target_: xbris.losses.TailWeightedKernelCRPS
          alpha: 0.95
          # lam_node_weights, not node_weights: Nordic points only. See the
          # scalers block above.
          scalers: ['pressure_level', 'general_variable', 'nan_mask_weights', 'lam_node_weights']

          # NULL ON PURPOSE. The loss sees normalised values, so this has to
          # be the normalised equivalent of the millimetre threshold, and the
          # conversion depends on statistics that live in the dataset:
          #
          #   scripts/tail_threshold.py --mm 20
          #
          # prints it. The loss refuses to build while this is null, because a
          # threshold that is wrong by the width of the distribution trains
          # perfectly happily and means nothing.
          #
          # 20 mm per 6 h is the starting point because the ranking already
          # reports area_ge_20 for every state, so how much of the domain this
          # term will actually see is known before the run rather than after.
          # 20 mm per 6 h in the units the loss sees, which are set by the
          # NORMALISER IN THE CHECKPOINT, not by the dataset. The warm start
          # loads MET's normaliser along with the weights: precipitation is
          # divided by a spread of 2.36946 mm and no mean is subtracted, so
          #
          #   0.020 m * 422.037 = 8.44074
          #
          # The first value here, 12.66, was converted with the dataset's own
          # mean and spread. To the model it meant 30 mm, not 20. Nothing
          # failed; the measurement's count of target points over the threshold
          # came out at a third of the true count at 20 mm, which is how it
          # showed. scripts/tail_threshold.py now reads the checkpoint's
          # normaliser and refuses to pass a value that does not mean what
          # --mm says.
          tail_threshold: 8.44074
          tail_variable: tp

          # Precipitation is dataset variable 48 but model output channel 38
          # of 87, because the output carries only what the model predicts and
          # the eleven forcings are not among them. That difference is exactly
          # the kind that trains happily while weighting the wrong field.
          #
          #   scripts/inspect_checkpoint.py --output-index tp <checkpoint>
          #
          # Written down rather than left to anemoi, because if anemoi does
          # not hand the loss its indices the run dies at construction. Where
          # it does hand them over they are checked against this, and a
          # disagreement stops the run instead of picking a side.
          tail_index: 38

          tail_scale: 1.0

    scalers: ['*']

    # MEASURED, NOT GUESSED: scripts/measure_tail_weight.py, 2026-09-15, with
    # the corrected threshold and the Nordic-only weights above. The result is
    # kept in results/tail-weight/measure-cpu-merged.json.
    #
    # The untouched warm-start model was run over the 23 extreme states the
    # ranking flagged in the training window and 23 ordinary states drawn at
    # random from it: three members, no gradients, each loss term recorded on
    # its own. On extreme states the main term averaged 1.91 and the tail term
    # 1.40e-4, so a weight of 13,716 makes the two equal where the tail
    # matters. On ordinary states the tail term averaged 2.6e-5, a fifth of
    # that, and on 15 of the 23 it was below 1e-5.
    #
    # At this weight the tail term is about half the loss on an extreme state
    # and, estimated over the whole window, 16.5 percent of it on average. At
    # the old placeholder of 100 it would have been 0.14 percent: the tail arm
    # would have been the control arm with extra arithmetic.
    #
    # The estimate is heavy-tailed. Four extreme states carry about half of
    # the mean, and a few ordinary draws held real Nordic downpours of their
    # own, being ordinary only by the ranking's area-based measure. The median
    # of the per-state ratios is 21,132. The ratio of means is used on
    # purpose: the weight should balance the terms where heavy rain actually
    # is, and that is where the mean is carried.
    loss_weights: [1.0, 13716.0]
