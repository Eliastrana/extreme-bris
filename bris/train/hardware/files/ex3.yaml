# The two halves of the cutout, and the graph taken out of the checkpoint.
#
# WARM START IS THE INFERENCE CHECKPOINT, NOT THE TRAINING ONE. The training
# checkpoint MET published unpickles into anemoi.models.migrations, a module
# absent from the anemoi-models 0.8.1 their own pyproject pins. The inference
# checkpoint loads cleanly, and with load_weights_only the optimiser state in
# the other one is not wanted anyway.
dataset_lam: meps-2p5km-year3-6h-v1.zarr
dataset_global: od-an-n320-year3-6h-v1.zarr
dataset: ${hardware.files.dataset_lam}
graph: n320_2p5k_7p10.pt
truncation: null
truncation_inv: null
checkpoint:
  every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
  every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
  every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
warm_start: /home/eliastra/bris-models/bris-forecaster/bris-crpsfft_inference.ckpt
