# anemoi-datasets recipe — MEPS 2.5 km, the LAM side of the Bris cutout.
#
# FIRST DRAFT, NOT YET RUN. The variable names, grid and levels below were read
# off the archive (see docs/MEPS.md) and are trustworthy. The filter wiring —
# argument names, ordering, whether rotation happens before or after renaming —
# is inferred from the anemoi-datasets 0.5.24 source and will need iterating
# against real error messages.
#
# Build with:
#   ~/bris-data-env/bin/anemoi-datasets create bris/configs/meps_2p5km.yaml \
#       ~/bris-data/meps-2p5km-2025-6h-v1.zarr
#
# Verified about the source data:
#   * grid is x=949, y=1069 on projection_lambert — exactly the pre-trim extent
#     read out of the checkpoint graph, so no domain fitting is needed
#   * pressure levels are 50..1000 with 800 extra and no 600; we take the 12 the
#     model wants and leave 800 out
#   * licence is NLOD / CC BY 4.0, no authentication
#
# Three traps, all of which produce output that runs and looks plausible:
# EVERY physical conversion happens after the build, in
# scripts/postprocess_meps.py, because every conversion filter in
# anemoi-datasets 0.5.24 is GRIB-only: they all read
# f.metadata(namespace="mars")["param"], and for xarray-sourced fields
# _as_mars() returns {}. Only rename, transform and the no-ops work here.
# So the recipe renames columns to their target names while they still hold the
# source quantity, and the values are converted in place afterwards.
#
#   1. x_wind/y_wind are grid-relative and must be rotated to earth-relative.
#      NOT DONE HERE: anemoi's rotate_winds filter reads
#      f.metadata(namespace="mars")["param"], and for xarray-sourced fields
#      _as_mars() returns {} — so it raises KeyError on any NetCDF or OPeNDAP
#      input, in upstream 0.5.24 and in MET's fork alike. Renaming first does
#      not help: RenamedFieldMapping delegates namespace lookups straight
#      through. Rotation is applied afterwards instead, by
#      scripts/rotate_meps_winds.py, which is mathematically equivalent — the
#      transform is pointwise and depends only on grid geometry.
#   2. upward_air_velocity_pl is m/s; ECMWF w is Pa/s — needs wz_to_w, which
#      changes both magnitude and sign
#   3. radiation must be the accumulated integral_of_* form, not instantaneous

dates:
  start: 2025-03-31T18:00:00
  end: 2025-04-01T00:00:00
  frequency: 6h

input:
  join:

    # ---- surface -----------------------------------------------------------
    - pipe:
        - opendap:
            url: https://thredds.met.no/thredds/dodsC/meps25epsarchive/{date:strftime(%Y)}/{date:strftime(%m)}/{date:strftime(%d)}/meps_det_sfc_{date:strftime(%Y%m%d)}T{date:strftime(%H)}Z.ncml
            options:
              # pydap rather than the netcdf4 C library. The .ncml is a
              # joinExisting aggregation over 67 per-leadtime files on MET's
              # internal Lustre, so dodsC is the only route to the data — the
              # underlying files are not exposed and fileServer returns the 8 KB
              # descriptor. netCDF4's DAP client fails on it with a bare I/O
              # error even with the CA configured in ~/.dodsrc; pydap is pure
              # Python, goes through requests, and honours REQUESTS_CA_BUNDLE.
              engine: pydap
            # Only the variables we map. Without this the source reads all
            # 114 surface fields, and ones like icing_index carry an extra height
            # dimension that collides on (valid_datetime, param, step).
            variable:
              - air_pressure_at_sea_level
              - air_temperature_0m
              - air_temperature_2m
              - cloud_area_fraction
              - high_type_cloud_area_fraction
              - integral_of_surface_downwelling_longwave_flux_in_air_wrt_time
              - integral_of_surface_downwelling_shortwave_flux_in_air_wrt_time
              - land_area_fraction
              - low_type_cloud_area_fraction
              - lwe_thickness_of_atmosphere_mass_content_of_water_vapor
              - medium_type_cloud_area_fraction
              - precipitation_amount_acc
              - relative_humidity_2m
              - surface_air_pressure
              - surface_geopotential
              - x_wind_10m
              - y_wind_10m

        - rename:
            param:
              air_temperature_2m: 2t
              air_temperature_0m: skt
              air_pressure_at_sea_level: msl
              surface_air_pressure: sp
              land_area_fraction: lsm
              surface_geopotential: z
              cloud_area_fraction: tcc
              high_type_cloud_area_fraction: hcc
              medium_type_cloud_area_fraction: mcc
              low_type_cloud_area_fraction: lcc
              lwe_thickness_of_atmosphere_mass_content_of_water_vapor: tcw
              precipitation_amount_acc: tp
              integral_of_surface_downwelling_shortwave_flux_in_air_wrt_time: ssrd
              integral_of_surface_downwelling_longwave_flux_in_air_wrt_time: strd
              x_wind_10m: 10u
              y_wind_10m: 10v
              # Holds RELATIVE HUMIDITY until postprocess_meps.py converts it.
              relative_humidity_2m: 2d

    # ---- pressure levels ---------------------------------------------------
    - pipe:
        - opendap:
            url: https://thredds.met.no/thredds/dodsC/meps25epsarchive/{date:strftime(%Y)}/{date:strftime(%m)}/{date:strftime(%d)}/meps_det_pl_{date:strftime(%Y%m%d)}T{date:strftime(%H)}Z.ncml
            options:
              engine: pydap
            # Only the variables we map. Without this the source reads all
            # 114 surface fields, and ones like icing_index carry an extra height
            # dimension that collides on (valid_datetime, param, step).
            variable:
              - air_temperature_pl
              - geopotential_pl
              - specific_humidity_pl
              - upward_air_velocity_pl
              - x_wind_pl
              - y_wind_pl
            # The selection key is the coordinate's own name, `pressure` — not
            # `level` or `levelist`, despite LevelCoordinate.mars_names naming
            # both. Verified against the file: level and levelist match zero
            # fields, pressure matches 1608 (2 vars x 12 levels x 67 leadtimes).
            # MEPS carries 13 levels; the model wants 12, so 800 is left out.
            pressure: [50, 100, 150, 200, 250, 300, 400, 500, 700, 850, 925, 1000]

        - rename:
            param:
              air_temperature_pl: t
              specific_humidity_pl: q
              geopotential_pl: z
              x_wind_pl: u
              y_wind_pl: v
              # Holds m/s until postprocess_meps.py converts it to Pa/s.
              upward_air_velocity_pl: w

# TODO, in the order they will probably bite:
#   * whether `2d` survives renaming, since the dewpoint filter names its output
#     via `td` before `rename` runs
#   * accumulated fields are zero at lead time 0. Harmless: tp, ssrd and strd
#     are diagnostic and not model inputs, but they must exist as columns.
#   * field_shape must come out 2D (949 x 1069) or trim_edge refuses the
#     dataset with "TrimEdge only works on regular grids"

build:
  # Default is "{param}_{levelist}", but these fields carry the level under
  # `pressure` — the coordinate's own name — so the level fell out of the name
  # and all twelve levels of each variable collided on
  # (valid_datetime, param, step).
  #
  # Naming is global, not per-branch. Surface fields have no `pressure` key; the
  # default handles the same situation for GRIB surface fields, which have no
  # levelist, so the missing key is expected to be dropped rather than to fail.
  # The rename filter runs first, so this yields z_50 rather than
  # geopotential_pl_50.
  variable_naming: "{param}_{pressure}"

output:
  statistics: valid_datetime
